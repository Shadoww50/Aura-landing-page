<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aura</title>
    <meta name="description" content="A showcase of decorative lamps from various  designers">
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <nav>
        <span class="logo"><a href="#">AURA</a></span>
        <ul id="nav-list">
          <li><a href="#">All products</a></li>
          <li><a href="#">Collections</a></li>
          <li><a href="#">Designer</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
        <div
          class="menu-btn"
          aria-expanded="false"
          aria-controls="nav-list"
          aria-label="open/close menu"
        >
          <span class="burger"></span>
        </div>
      </nav>
    </header>
    <main>
      <div class="hero">
        <h1>Enlighten your mood</h1>
        <p>
          More than a lamp, an organic art piece that affects the whole vibe of
          your room
        </p>
        <button class="outline"><span>Get in touch</span></button>
        <img src="assets/bg/bg3.jfif" alt="" class="hero-bg" >
      </div>
      <section id="overview">
        <div class="intro">
        <h2>Objects of light.</h2>
        <p class="secondary">Sculptural forms for everyday spaces.</p>
        </div>
        <div class="track">
          <button class="arrow left">⟵</button>
          <button class="arrow right">⟶</button>
          <div class="card">
            <img src="assets/product (1).jpg" alt="a product's visual" draggable="false">
          </div>
          <div class="card">
            <img src="assets/product (2).jpg" alt="a product's visual" draggable="false">
          </div>
          <div class="card">
            <img src="assets/product (3).jpg" alt="a product's visual" draggable="false">
          </div>
          <div class="card">
            <img src="assets/product (4).jpg" alt="a product's visual" draggable="false">
          </div>
          <div class="card">
            <img src="assets/product (5).jpg" alt="a product's visual" draggable="false">
          </div>
          <div class="card">
            <img src="assets/product (6).jpg" alt="a product's visual" draggable="false">
          </div>
          <div class="card">
            <img src="assets/product (7).jpg" alt="a product's visual" draggable="false">
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
